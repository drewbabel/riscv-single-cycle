name: CI

env:
  OSS_CAD_SUITE: '2026-07-24'
  SV2V: 'v0.0.13'
  RISCV_FORMAL_SHA: '2bd7410'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testbench-list:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - name: Split testbenches into groups
        id: list
        run: |
          groups=$(ls tb/*_tb.sv | sed 's#.*/##;s#_tb\.sv$##' | grep -vE '^(freertos_boot|coremark_boot|prog)$' | python3 -c "import sys, json; n=[l.strip() for l in sys.stdin if l.strip()]; g=[[] for _ in range(4)]; [g[i % 4].append(x) for i, x in enumerate(n)]; print(json.dumps([' '.join(x) for x in g if x]))")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  testbenches:
    needs: testbench-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.testbench-list.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: Run the testbench group
        run: |
          for mod in ${{ matrix.group }}; do
            echo "== $mod =="
            make MOD="$mod"
          done

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - uses: ./.github/actions/riscv-toolchain
      - name: Run self-checking assembly programs
        run: |
          for p in trap_annul; do
            echo "== $p =="
            make prog PROG="$p"
          done

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/$SV2V/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: alu formal
        run: make formal MOD=alu
      - name: irq formal
        run: make formal MOD=irq

  core-formal-list:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/$SV2V/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone riscv-formal
        run: |
          git clone https://github.com/YosysHQ/riscv-formal.git
          git -C riscv-formal checkout "$RISCV_FORMAL_SHA"
      - name: Split checks into groups
        id: list
        env:
          RISCV_FORMAL_DIR: ${{ github.workspace }}/riscv-formal
        run: |
          groups=$(bash formal/rvfi/run.sh --list | python3 -c "import sys, json; n=[l.strip() for l in sys.stdin if l.strip()]; g=[[] for _ in range(8)]; [g[i % 8].append(x) for i, x in enumerate(n)]; print(json.dumps([' '.join(x) for x in g if x]))")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  core-formal:
    needs: core-formal-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.core-formal-list.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/$SV2V/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone riscv-formal
        run: |
          git clone https://github.com/YosysHQ/riscv-formal.git
          git -C riscv-formal checkout "$RISCV_FORMAL_SHA"
      - name: Prove the group
        env:
          RISCV_FORMAL_DIR: ${{ github.workspace }}/riscv-formal
        run: bash formal/rvfi/run.sh ${{ matrix.group }}

  cosim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - uses: ./.github/actions/riscv-toolchain
        with:
          extra-packages: device-tree-compiler libfdt-dev
      - name: Cache Spike
        id: spike-cache
        uses: actions/cache@v6
        with:
          path: /opt/spike
          key: spike-riscv-isa-sim-v1
      - name: Build Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-isa-sim.git
          cd riscv-isa-sim && mkdir build && cd build
          ../configure --prefix=/opt/spike
          make -j"$(nproc)"
          make install
      - name: Add Spike to environment
        run: |
          echo "/opt/spike/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/spike/lib" >> "$GITHUB_ENV"
      - name: Compiled-C co-sim
        run: python3 tests/cosim.py cprog
      - name: Randomized co-sim regression (500 programs)
        run: python3 tests/cosim.py --rand 500

  freertos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - uses: ./.github/actions/riscv-toolchain
      - name: Clone FreeRTOS-Kernel
        run: |
          git clone https://github.com/FreeRTOS/FreeRTOS-Kernel.git sw/FreeRTOS-Kernel
          git -C sw/FreeRTOS-Kernel checkout 9db704cd3bbe4963f9bd3de1f1161ea2cf90768b
      - name: Build FreeRTOS demo image
        run: make -C sw/freertos all
      - name: Run FreeRTOS queue demo testbench
        run: make MOD=freertos_boot

  coremark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/riscv-toolchain
      - name: Build CoreMark image
        run: make -C sw/coremark all

  ci-gate:
    if: always()
    needs: [testbench-list, testbenches, selfcheck, formal, core-formal-list, core-formal, cosim, freertos, coremark]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required CI jobs did not succeed."
          exit 1
